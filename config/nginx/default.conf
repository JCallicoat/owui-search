# Caching reverse proxy in front of SearXNG.
# Listens on 8081 inside the "search" pod; the pod publishes it as 127.0.0.1:8888.

# ~/.cache/searxng/search on the host. max_size is enforced by nginx's cache
# manager, which evicts least recently used entries (it can briefly overshoot).
proxy_cache_path /var/cache/nginx/searxng levels=1:2 keys_zone=searx:10m
                 max_size=500m inactive=24h use_temp_path=off;

server {
    listen 8081;

    # SearXNG's bot detection expects the client address from the proxy and
    # logs an error on every request without it. Applies to both locations.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /search {
        proxy_pass http://127.0.0.1:8080;

        proxy_cache searx;
        proxy_cache_key "$request_uri";        # identical query + parameters = hit
        proxy_cache_valid 200 1h;              # only successful responses are cached
        proxy_cache_lock on;                   # collapse simultaneous identical requests
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # SearXNG web UI, static files and everything else: passed through uncached.
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
